openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Cytek Quoting Tool API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: assets
    description: Asset data lookup
  - name: parts
    description: Parts catalog
  - name: quotes
    description: Quote generation
  - name: data-sources
    description: The asset/pricing data source behind Manual Mode
paths:
  /data-sources:
    get:
      operationId: listDataSources
      tags: [data-sources]
      summary: List all data sources (built-in and uploaded) and which is the default
      responses:
        "200":
          description: Data source listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceListing"
    post:
      operationId: createDataSource
      tags: [data-sources]
      summary: Add a data source by uploading a Cytek-format workbook (one-time import)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                file:
                  type: string
                  format: binary
              required: [name, file]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceSummary"
        "400":
          description: Invalid workbook or name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /data-sources/{id}/replace:
    post:
      operationId: replaceDataSourceWorkbook
      tags: [data-sources]
      summary: Re-import an uploaded data source from a newer workbook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceSummary"

  /data-sources/{id}/default:
    post:
      operationId: setDefaultDataSource
      tags: [data-sources]
      summary: Make a data source the default for Manual Mode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Default updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  defaultId:
                    type: string
                required: [defaultId]

  /data-sources/{id}:
    delete:
      operationId: deleteDataSource
      tags: [data-sources]
      summary: Delete an uploaded data source (built-in sources cannot be deleted)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /assets/lookup:
    get:
      operationId: lookupAsset
      tags: [assets]
      summary: Look up asset by serial number
      parameters:
        - name: serial
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/DataSourceParam"
      responses:
        "200":
          description: Asset found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetLookupResult"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assets/serials:
    get:
      operationId: listSerials
      tags: [assets]
      summary: List all serial numbers for autocomplete
      parameters:
        - $ref: "#/components/parameters/DataSourceParam"
      responses:
        "200":
          description: List of serial numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialsListResult"

  /parts:
    get:
      operationId: listParts
      tags: [parts]
      summary: List all products (parts and services, priced or not) from a data source
      parameters:
        - $ref: "#/components/parameters/DataSourceParam"
      responses:
        "200":
          description: Parts list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartsListResult"

  /quotes/generate:
    post:
      operationId: generateQuote
      tags: [quotes]
      summary: Generate a PDF quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: PDF generated
          content:
            application/pdf:
              schema:
                type: string
                format: binary

components:
  parameters:
    DataSourceParam:
      name: dataSource
      in: query
      required: false
      description: Data source id to query; defaults to the default data source.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AssetData:
      type: object
      properties:
        serialNumber:
          type: string
        assetName:
          type: string
        accountName:
          type: string
        facilityName:
          type: string
        contractNumber:
          type: string
        contractType:
          type: string
        contractStatus:
          type: string
        productName:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        street:
          type: string
        city:
          type: string
        stateZip:
          type: string
        region:
          type: string
        serviceTerritory:
          type: string
        primaryTechnician:
          type: string
        contractEndDate:
          type: string
          description: ISO date (YYYY-MM-DD) or empty when no contract.
        country:
          type: string
        assetStatus:
          type: string
          description: Asset lifecycle status from the source, e.g. "Installed".
        installDate:
          type: string
          description: ISO date (YYYY-MM-DD) or empty.
      required:
        - serialNumber
        - assetName
        - accountName

    DataSourceSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isDefault:
          type: boolean
        importedAt:
          type: string
        updatedAt:
          type: string
          description: Last time the source was created or its workbook replaced.
        sourceFiles:
          type: array
          items:
            type: string
        assetCount:
          type: integer
        productCount:
          type: integer
        unpricedProductCount:
          type: integer
      required:
        - id
        - name
        - isDefault
        - importedAt
        - updatedAt
        - sourceFiles
        - assetCount
        - productCount
        - unpricedProductCount

    DataSourceListing:
      type: object
      properties:
        dataSources:
          type: array
          items:
            $ref: "#/components/schemas/DataSourceSummary"
        defaultId:
          type: string
          nullable: true
          description: null when no data source exists yet.
        persistent:
          type: boolean
          description: false when data sources will not survive a server restart.
        storeKind:
          type: string
          description: memory, file or postgres.
      required:
        - dataSources
        - defaultId
        - persistent
        - storeKind

    AssetLookupResult:
      type: object
      properties:
        asset:
          $ref: "#/components/schemas/AssetData"
      required:
        - asset

    SerialsListResult:
      type: object
      properties:
        serials:
          type: array
          items:
            type: string
      required:
        - serials

    PartItem:
      type: object
      properties:
        partName:
          type: string
        partNumber:
          type: string
        listPrice:
          type: number
        netPrice:
          type: number
        category:
          type: string
          description: '"Service" or "Parts".'
        unit:
          type: string
          description: Sale unit from the source (e.g. "Each", "Year").
        priced:
          type: boolean
          description: false when the source has no usable list price for this item (listPrice is 0).
      required:
        - partName
        - listPrice

    PartsListResult:
      type: object
      properties:
        parts:
          type: array
          items:
            $ref: "#/components/schemas/PartItem"
      required:
        - parts

    QuoteLineItem:
      type: object
      properties:
        description:
          type: string
        partNumber:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          description: List price per unit before any discount.
        discountPercent:
          type: number
          description: Quote-specific discount, 0-100. Blank/0 keeps the list price.
        netPrice:
          type: number
          description: Discounted (selling) price per unit. Defaults to unitPrice less discountPercent.
      required:
        - description
        - quantity
        - unitPrice

    QuoteRequest:
      type: object
      properties:
        customerName:
          type: string
        accountName:
          type: string
        facilityName:
          type: string
        address:
          type: string
        serialNumber:
          type: string
        contractType:
          type: string
        serviceType:
          type: string
        servicePrice:
          type: number
        serviceDiscountPercent:
          type: number
          description: Quote-specific discount on the service line, 0-100.
        productName:
          type: string
          description: Instrument/product name printed with the serial number on the quote.
        parts:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLineItem"
        shipping:
          type: number
          description: Shipping & handling charge added to the quote total.
        notes:
          type: string
      required:
        - customerName
        - serialNumber
        - parts

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
