openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Cytek Quoting Tool API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: assets
    description: Asset data lookup
  - name: parts
    description: Parts catalog
  - name: quotes
    description: Quote generation
  - name: data-sources
    description: The asset/pricing data source behind Manual Mode
paths:
  /data-source:
    get:
      operationId: getDataSource
      tags: [data-sources]
      summary: Describe the default data source (name, import date, record counts)
      responses:
        "200":
          description: Data source summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceSummary"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /assets/lookup:
    get:
      operationId: lookupAsset
      tags: [assets]
      summary: Look up asset by serial number
      parameters:
        - name: serial
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetLookupResult"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assets/serials:
    get:
      operationId: listSerials
      tags: [assets]
      summary: List all serial numbers for autocomplete
      responses:
        "200":
          description: List of serial numbers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SerialsListResult"

  /parts:
    get:
      operationId: listParts
      tags: [parts]
      summary: List all available parts from pricing data
      responses:
        "200":
          description: Parts list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartsListResult"

  /quotes/generate:
    post:
      operationId: generateQuote
      tags: [quotes]
      summary: Generate a PDF quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: PDF generated
          content:
            application/pdf:
              schema:
                type: string
                format: binary

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AssetData:
      type: object
      properties:
        serialNumber:
          type: string
        assetName:
          type: string
        accountName:
          type: string
        facilityName:
          type: string
        contractNumber:
          type: string
        contractType:
          type: string
        contractStatus:
          type: string
        productName:
          type: string
        contactName:
          type: string
        contactEmail:
          type: string
        street:
          type: string
        city:
          type: string
        stateZip:
          type: string
        region:
          type: string
        serviceTerritory:
          type: string
        primaryTechnician:
          type: string
        contractEndDate:
          type: string
          description: ISO date (YYYY-MM-DD) or empty when no contract.
        country:
          type: string
        assetStatus:
          type: string
          description: Asset lifecycle status from the source, e.g. "Installed".
        installDate:
          type: string
          description: ISO date (YYYY-MM-DD) or empty.
      required:
        - serialNumber
        - assetName
        - accountName

    DataSourceSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isDefault:
          type: boolean
        importedAt:
          type: string
        sourceFiles:
          type: array
          items:
            type: string
        assetCount:
          type: integer
        productCount:
          type: integer
      required:
        - id
        - name
        - isDefault
        - importedAt
        - sourceFiles
        - assetCount
        - productCount

    AssetLookupResult:
      type: object
      properties:
        asset:
          $ref: "#/components/schemas/AssetData"
      required:
        - asset

    SerialsListResult:
      type: object
      properties:
        serials:
          type: array
          items:
            type: string
      required:
        - serials

    PartItem:
      type: object
      properties:
        partName:
          type: string
        partNumber:
          type: string
        listPrice:
          type: number
        netPrice:
          type: number
        category:
          type: string
          description: '"Service" or "Parts".'
        unit:
          type: string
          description: Sale unit from the source (e.g. "Each", "Year").
      required:
        - partName
        - listPrice

    PartsListResult:
      type: object
      properties:
        parts:
          type: array
          items:
            $ref: "#/components/schemas/PartItem"
      required:
        - parts

    QuoteLineItem:
      type: object
      properties:
        description:
          type: string
        partNumber:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
      required:
        - description
        - quantity
        - unitPrice

    QuoteRequest:
      type: object
      properties:
        customerName:
          type: string
        accountName:
          type: string
        facilityName:
          type: string
        address:
          type: string
        serialNumber:
          type: string
        contractType:
          type: string
        serviceType:
          type: string
        servicePrice:
          type: number
        parts:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLineItem"
        shipping:
          type: number
          description: Shipping & handling charge added to the quote total.
        notes:
          type: string
      required:
        - customerName
        - serialNumber
        - parts

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
