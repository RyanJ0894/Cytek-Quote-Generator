kind = "web"
previewPath = "/"
title = "Cytek Quoting Tool"
version = "1.0.0"
id = "artifacts/quoting-tool"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22515
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/quoting-tool run dev"

[services.env]
PORT = "22515"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/quoting-tool", "run", "build"]
publicDir = "artifacts/quoting-tool/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
