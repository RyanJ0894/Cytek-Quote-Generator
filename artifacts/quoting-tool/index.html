<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Evans Quote Generator</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0e1522" />
    <script>
      // Apply the theme before anything renders so a returning user never sees
      // a flash of the wrong theme. Dark Mode is the default; only an explicitly
      // saved "light" choice selects Light Mode. Must use the same storage key
      // as src/hooks/use-theme.ts.
      (function () {
        var dark = true;
        try { dark = localStorage.getItem("eqg-theme") !== "light"; } catch (e) {}
        if (dark) document.documentElement.classList.add("dark");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Aggressively hide any Replit badge elements */
      #replit-badge-container,
      [id^="replit"],
      [class*="replit-badge"],
      [data-replit-badge],
      a[href*="replit.com"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
        position: absolute !important;
        clip: rect(0,0,0,0) !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // MutationObserver to remove Replit badge the instant it's injected
      (function() {
        function removeBadge() {
          var selectors = [
            '#replit-badge-container',
            '[id^="replit"]',
            '[class*="replit"]',
            'a[href*="replit.com"]'
          ];
          selectors.forEach(function(sel) {
            document.querySelectorAll(sel).forEach(function(el) {
              el.remove();
            });
          });
        }
        var observer = new MutationObserver(removeBadge);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener('DOMContentLoaded', removeBadge);
        window.addEventListener('load', removeBadge);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
