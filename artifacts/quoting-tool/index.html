    <title>Cytek Quoting Tool</title>

    <style>
      /* Hide Replit badge */
      #replit-badge-container,
      [data-replit-badge],
      a[href*="replit.com"]:not([class]),
      div[class*="replit-badge"],
      div[id*="replit-badge"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
